services:
  - type: web
    name: jobtap-module-c
    env: docker
    plan: starter
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FRONTEND_ORIGINS
        sync: false
      - key: TYPEORM_SYNCHRONIZE
        value: false
